// DO NOT EDIT THIS FILE! IT IS GENERATED EACH TIME "capacitor update" IS RUN
def getPluginDir(String relativePath) {
    def inParent = new File(rootDir, "../node_modules/${relativePath}")
    if (inParent.exists()) return inParent
    def inRoot = new File(rootDir, "node_modules/${relativePath}")
    if (inRoot.exists()) return inRoot
    return inParent
}

include ':capacitor-android'
project(':capacitor-android').projectDir = getPluginDir('@capacitor/android/capacitor')

include ':capacitor-app'
project(':capacitor-app').projectDir = getPluginDir('@capacitor/app/android')

include ':capacitor-device'
project(':capacitor-device').projectDir = getPluginDir('@capacitor/device/android')
